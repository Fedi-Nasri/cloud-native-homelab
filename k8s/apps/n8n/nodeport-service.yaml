# Pinned public entry point for n8n (ADR-020).
# The chart's own Service cannot set a nodePort, so this separate Service pins 30079.
# It only needs to select the n8n pods; the chart's ClusterIP Service still exists.
apiVersion: v1
kind: Service
metadata:
  name: n8n-nodeport
  namespace: n8n
  labels:
    app.kubernetes.io/name: n8n
    app.kubernetes.io/part-of: cloud-native-homelab
spec:
  type: NodePort
  selector:
    app.kubernetes.io/name: n8n
    app.kubernetes.io/instance: n8n
  ports:
    - name: http
      port: 5678
      targetPort: 5678
      protocol: TCP
      nodePort: 30079
