# chart: grafana/promtail 6.17.1 (app 3.5.1)
# repo:  https://grafana.github.io/helm-charts
#
# Ships node logs to Loki. Install after Loki; the gateway is disabled there, so the client
# targets the `loki` service directly.

config:
  clients:
    - url: http://loki.observability.svc.cluster.local:3100/loki/api/v1/push

resources:
  requests:
    cpu: 30m
    memory: 64Mi
  limits:
    cpu: 200m
    memory: 128Mi

serviceMonitor:
  enabled: true
