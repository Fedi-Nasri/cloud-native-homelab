# Grafana datasource for Loki, auto-loaded by the Grafana sidecar.
# The kube-prometheus-stack Grafana sidecar watches ConfigMaps labelled grafana_datasource=1.
apiVersion: v1
kind: ConfigMap
metadata:
  name: loki-datasource
  namespace: observability
  labels:
    grafana_datasource: "1"
data:
  loki-datasource.yaml: |-
    apiVersion: 1
    datasources:
      - name: Loki
        type: loki
        access: proxy
        url: http://loki.observability.svc.cluster.local:3100
        isDefault: false
        editable: true
